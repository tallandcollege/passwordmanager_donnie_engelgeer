name: Copy Wiki from Upstream repository

# Controls when the workflow will run
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "copy-wiki"
  copy-wiki:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    permissions: 
      contents: write
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out parent wiki repo under $GITHUB_WORKSPACE and current wiki
      - uses: actions/checkout@v4
        with:
          repository: ${{github.repository}}.wiki.git
          path: wikiUpstream
      
      - uses: actions/checkout@v4
        with:
          repository: horizoncollege/portfolio-verslag-template.wiki.git
          path: wiki
      

      # Runs a set of commands using the runners shell
      - name: Copy wiki files and commit to curent repo wiki
        run: |
          cp wikiUpstream/*.md wiki -f -v
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "Updated wiki from upstream repository
          git push -f
